name: Sync and validate catalog

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "uploads/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Sync DOCX paths
        run: python scripts/sync_catalog.py

      - name: Validate catalog
        run: python scripts/validate_catalog.py

      - name: Commit catalog changes
        run: |
          if git diff --quiet -- data/outcomes.json; then
            echo "Katalogda değişiklik yok."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/outcomes.json
          git commit -m "Auto-sync catalog [skip ci]"
          git push

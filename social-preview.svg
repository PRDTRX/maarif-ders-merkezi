<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Maarif Ders Merkezi — Dersini tasarla</title>
  <desc id="description">Öğretmenler için ders materyali keşif alanı; güçlü tipografi, geometrik formlar ve canlı limon yeşiliyle yeni tasarım.</desc>
  <rect width="1200" height="630" fill="#f4f0e6"/>
  <path d="M0 0h1200v68H0z" fill="#171916"/>
  <rect x="72" y="18" width="32" height="32" fill="#d9ff3f"/>
  <path d="M78 43 86 25h5l8 18h-6l-1-4h-7l-1 4z" fill="#171916"/>
  <text x="122" y="40" fill="#f4f0e6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" letter-spacing="2">MAARİF DERS MERKEZİ</text>
  <text x="1100" y="40" fill="#d9ff3f" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">MDM / 2026</text>
  <rect x="0" y="68" width="700" height="562" fill="#d9ff3f"/>
  <text x="76" y="132" fill="#171916" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900" letter-spacing="3">MERAK ET. ARA. TASARLA.</text>
  <text x="66" y="270" fill="#171916" font-family="Arial Black, Arial, sans-serif" font-size="110" font-weight="900" letter-spacing="-8">DERSİN</text>
  <text x="66" y="372" fill="#171916" font-family="Arial Black, Arial, sans-serif" font-size="110" font-weight="900" letter-spacing="-8">SENİN.</text>
  <text x="70" y="440" fill="#fa5b35" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="-4">FİKRİN SERBEST.</text>
  <text x="76" y="515" fill="#30352e" font-family="Arial, Helvetica, sans-serif" font-size="20">Kaynakları keşfet. Bağlantıları kur.</text>
  <text x="76" y="545" fill="#30352e" font-family="Arial, Helvetica, sans-serif" font-size="20">Kendi sınıfın için karar ver.</text>
  <rect x="770" y="145" width="340" height="340" fill="#fa5b35"/>
  <circle cx="970" cy="294" r="132" fill="#d9ff3f" stroke="#171916" stroke-width="3"/>
  <path d="M840 390 965 190 1090 390Z" fill="#171916"/>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sayfa Bulunamadı | Maarif Ders Merkezi</title>
<meta name="theme-color" content="#172033">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#172033;--text:#3f4755;--muted:#737b88;--line:#e5e7eb;--bg:#fafaf9;--white:#fff;--accent:#315c9b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
.box{width:min(520px,calc(100% - 32px));padding:42px 28px;text-align:center;border:1px solid var(--line);border-radius:16px;background:var(--white);box-shadow:0 14px 36px rgba(23,32,51,.06)}
.mark{width:44px;height:44px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid #d8dee8;border-radius:11px;background:#f5f7fa;color:var(--ink);font:800 12px/1 Manrope,sans-serif}
.code{margin:0;color:var(--accent);font:800 12px/1 Manrope,sans-serif;letter-spacing:.12em}
h1{margin:8px 0 10px;color:var(--ink);font:800 32px/1.1 Manrope,sans-serif;letter-spacing:-.045em}
p{margin:0 auto 24px;max-width:390px;color:var(--muted);font-size:13px;line-height:1.6}
a{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:8px;background:var(--ink);color:#fff;text-decoration:none;font-size:11px;font-weight:600}
a:hover{background:#0d1421}
</style>
</head>
<body>
<main class="box">
<div class="mark">MD</div>
<p class="code">MAARİF DERS MERKEZİ</p>
<h1>Sayfa bulunamadı.</h1>
<p>Aradığınız sayfa mevcut değil veya taşınmış olabilir.</p>
<a href="./">Ana Sayfaya Dön</a>
</main>
</body>
</html>

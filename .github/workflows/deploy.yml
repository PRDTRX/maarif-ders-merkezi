name: Validate and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check assets/js/app.js
      - name: Validate catalog and resource schema JSON
        run: |
          python - <<'PY'
          import json
          for path in ("data/catalog.json", "templates/resource.schema.json"):
              with open(path, encoding="utf-8") as handle:
                  json.load(handle)
              print(f"Valid JSON: {path}")
          PY
      - name: Validate catalog references
        run: |
          python - <<'PY'
          import json, os, sys
          cat = json.load(open("data/catalog.json", encoding="utf-8"))
          schema = json.load(open("templates/resource.schema.json", encoding="utf-8"))["properties"]
          cats = {c["id"] for c in cat["categories"]}
          if cats != set(schema["categoryId"]["enum"]):
              sys.exit("categoryId enum (schema) ile catalog.json kategorileri uyumsuz")
          errors, seen = [], set()
          for r in cat["resources"]:
              rid = r.get("id")
              if rid in seen: errors.append(f"Yinelenen id: {rid}")
              seen.add(rid)
              if r.get("categoryId") not in cats: errors.append(f"{rid}: geçersiz categoryId")
              if r.get("type") not in schema["type"]["enum"]: errors.append(f"{rid}: geçersiz type")
              f = r.get("file", "")
              if r.get("sourceType") != "external" and (not f or not os.path.isfile(f)):
                  errors.append(f"{rid}: dosya bulunamadı ({f})")
          if errors:
              sys.exit("\n".join(errors))
          print(f"Catalog OK: {len(cat['resources'])} kaynak")
          PY

  pages-check:
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check if GitHub Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl --silent --show-error --output /tmp/pages.json --write-out "%{http_code}" -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Validation passed. Enable GitHub Pages in Settings > Pages to publish the site (HTTP $code)."
          fi

  deploy:
    if: needs.pages-check.outputs.enabled == 'true'
    needs: [validate, pages-check]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

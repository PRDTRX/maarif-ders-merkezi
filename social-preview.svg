  <text x="1080" y="463" fill="#171916" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="900" letter-spacing="2">ARA ↗ YORUMLA ↗ UYARLA</text>
  <path d="M770 520H1110" stroke="#171916" stroke-width="2"/>
  <text x="770" y="553" fill="#171916" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900">BAĞIMSIZ ÖĞRETMEN MATERYAL KATALOĞU</text>
  <text x="770" y="580" fill="#5e6258" font-family="Arial, Helvetica, sans-serif" font-size="13">Kaynak, bağlam ve öğretmen yorumu.</text>
